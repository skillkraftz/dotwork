<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dotwork" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Dotwork</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Dotwork</h1>
        <div class="dropdown" id="drop-page">
          <button id="menu-page" class="menubtn" data-help="menu-page" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="list-page"><span id="menu-page-label">Page</span><span class="caret" aria-hidden="true">▾</span></button>
          <div class="menu-list" id="list-page" role="menu" aria-label="Page" hidden>
            <button id="view-page" data-help="view-page" type="button" role="menuitemradio" aria-checked="true">Page</button>
            <button id="view-spread" data-help="view-spread" type="button" role="menuitemradio" aria-checked="false">Spread</button>
            <button id="view-book" data-help="view-book" type="button" role="menuitemradio" aria-checked="false">Book</button>
            <button id="settings" data-help="settings" type="button" role="menuitem">Settings…</button>
          </div>
        </div>
        <div class="dropdown" id="drop-edit">
          <button id="menu-edit" class="menubtn" data-help="menu-edit" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="list-edit"><span>Edit</span><span class="caret" aria-hidden="true">▾</span></button>
          <div class="menu-list" id="list-edit" role="menu" aria-label="Edit" hidden>
            <button id="mode-edit" data-help="mode-edit" type="button" role="menuitemradio" aria-checked="true">Edit</button>
            <button id="mode-preview" data-help="mode-preview" type="button" role="menuitemradio" aria-checked="false">Preview</button>
            <button id="library" data-help="library" type="button" role="menuitem">Library…</button>
            <button id="new" data-help="new" type="button" role="menuitem">New</button>
          </div>
        </div>
        <button id="export" class="menubtn" data-help="export" type="button" aria-haspopup="dialog">Export</button>
        <div class="group" id="group-history" role="group" aria-label="History">
          <button id="undo" data-help="undo" type="button" class="iconbtn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 010 11h-4"/></svg><span class="label">Undo</span></button>
          <button id="redo" data-help="redo" type="button" class="iconbtn" title="Redo (Shift+Ctrl/Cmd+Z)" aria-label="Redo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l5 5-5 5"/><path d="M20 10H10a6 6 0 000 11h4"/></svg><span class="label">Redo</span></button>
          <button id="help" data-help="help" type="button" class="iconbtn" title="Help: tap anything to see what it does" aria-label="Help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5"/><path d="M12 17h0"/></svg></button>
        </div>
      </header>
      <div id="docbar" hidden>
        <div class="doc-row">
          <button id="doc-name" data-help="doc-name" type="button"></button>
          <span id="doc-status" role="status" data-help="doc-status"></span>
          <button id="doc-retry" data-help="doc-retry" type="button" hidden>Retry</button>
        </div>
        <div id="builtin-bar" class="doc-row" hidden>
          <span>Built-in. Editing makes a copy.</span>
          <button id="doc-copy" data-help="doc-copy" type="button">Edit a copy</button>
        </div>
      </div>
      <main>
        <section id="book" hidden></section>
        <section id="canvas-wrap">
          <svg id="canvas" role="img" aria-label="Page editor"></svg>
          <div id="spread" hidden>
            <div class="half" data-side="left"><span class="tag">Left page</span><svg id="canvas-left" role="img" aria-label="Left page editor"></svg></div>
            <div class="half" data-side="right"><span class="tag">Right page</span><svg id="canvas-right" role="img" aria-label="Right page editor"></svg></div>
          </div>
          <div id="spread-bar" class="floating seg" role="group" aria-label="Spread pages" hidden>
            <button id="side-left" data-help="side-left" type="button">Left</button>
            <button id="side-right" data-help="side-right" type="button">Right</button>
            <button id="side-both" data-help="side-both" type="button" title="See both pages side by side, as they will look open">View spread</button>
          </div>
          <div id="canvas-tools" class="floating" role="group" aria-label="Page view">
            <button id="fit" data-help="fit" type="button" class="iconbtn" title="Fit the page to the screen" aria-label="Fit page to screen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="label">Fit</span></button>
            <button id="layers-button" data-help="layers-button" type="button" class="iconbtn" title="Layers and page settings" aria-label="Layers"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="label">Layers</span></button>
          </div>
          <div id="group-banner" role="status" hidden>
            <span>Editing inside a group</span>
            <button type="button" id="group-done" data-help="group-done">Done</button>
          </div>
        </section>
        <aside id="sheet" data-state="closed" aria-label="Properties and layers">
          <div class="sheet-head">
            <span class="sheet-title">Edit</span>
            <button type="button" class="sheet-close" data-help="sheet-close" aria-label="Close panel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Close</span></button>
          </div>
          <div id="panel"></div>
        </aside>
        <div id="notice" role="status" hidden></div>
      </main>
      <nav id="tools" aria-label="Tools">
        <div id="bar-modes" role="group" aria-label="Mode">
          <button type="button" id="bar-select" data-bar-mode="select" data-help="mode-select" title="Select: pick, move and change what is on the page (V)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l12 7-5 1.5L11 17z"/></svg><span class="label">Select</span></button>
          <button type="button" id="bar-draw" data-bar-mode="draw" data-help="mode-draw" title="Draw: pattern, shade, box, rule, text"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg><span class="label">Draw</span></button>
          <button type="button" id="advanced" data-bar-mode="advanced" data-help="mode-advanced" title="Advanced: sequence, icon, checkboxes, widgets (A)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><path d="M17 13.5v7M13.5 17h7"/></svg><span class="label">Advanced</span></button>
        </div>
        <div id="bar-context" role="group" aria-label="Actions"></div>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
