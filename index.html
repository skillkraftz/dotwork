<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dotwork</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Ccircle cx=%274%27 cy=%274%27 r=%272%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Dotwork</h1>
        <div class="group" role="group" aria-label="View">
          <button id="view-page" type="button" title="Edit one page">Page</button>
          <button id="view-spread" type="button" title="Edit a left and a right page side by side">Spread</button>
          <button id="view-book" type="button" title="Arrange pages into a book and export print files">Book</button>
          <input id="spread-name" type="text" aria-label="Spread name" placeholder="Spread name" maxlength="80" />
        </div>
        <div class="group" id="group-mode" role="group" aria-label="Mode">
          <button id="mode-edit" type="button">Edit</button>
          <button id="mode-preview" type="button">Preview</button>
        </div>
        <div class="group" id="tools" role="group" aria-label="Tools">
          <button type="button" data-tool="select" title="Select (V)">Select</button>
          <button type="button" data-tool="shade" title="Shade (S)">Shade</button>
          <button type="button" data-tool="pattern" title="Pattern (P)">Pattern</button>
          <button type="button" data-tool="box" title="Box (B)">Box</button>
          <button type="button" data-tool="rule" title="Rule (R)">Rule</button>
          <button type="button" data-tool="checkboxes" title="Checkboxes (C)">Checkboxes</button>
          <button type="button" data-tool="text" title="Text (T)">Text</button>
          <label class="toggle" title="Snap to half cells (or hold Shift)"><input id="half-cells" type="checkbox" /> Half cells</label>
        </div>
        <div class="group" id="group-history">
          <button id="undo" type="button" title="Undo (Ctrl/Cmd+Z)">Undo</button>
          <button id="redo" type="button" title="Redo (Shift+Ctrl/Cmd+Z)">Redo</button>
        </div>
        <div class="group">
          <button id="library" type="button" title="Saved pages and spreads">Library</button>
          <button id="new" type="button">New</button>
          <select id="examples" aria-label="Load an example"></select>
        </div>
        <div class="group">
          <button id="import" type="button">Import JSON</button>
          <button id="export-json" type="button">Export JSON</button>
          <button id="export-png" type="button">Export PNG</button>
        </div>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
      </header>
      <main>
        <section id="book" hidden></section>
        <section id="canvas-wrap">
          <svg id="canvas" role="img" aria-label="Page editor"></svg>
          <div id="spread" hidden>
            <div class="half" data-side="left"><span class="tag">Left page</span><svg id="canvas-left" role="img" aria-label="Left page editor"></svg></div>
            <div class="half" data-side="right"><span class="tag">Right page</span><svg id="canvas-right" role="img" aria-label="Right page editor"></svg></div>
          </div>
          <div id="notice" role="status" hidden></div>
        </section>
        <aside id="panel"></aside>
      </main>
      <footer id="status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
